# OWASP ZAP Custom Rules Configuration
# Format: <action> <alert code> <message>

# Example: FAIL on email hyperlink injection (Alert Code: 40024)
# FAIL 40024 "Email hyperlink injection detected"

# # FAIL on other injection flaws (e.g., SQL Injection, XSS)
# FAIL 40018 "SQL Injection detected"
# FAIL 40016 "Cross-Site Scripting (XSS) detected"

# # Optionally, you can IGNORE rules that are not relevant
# IGNORE 10021 "Cookie without HttpOnly flag"

IGNORE:10020  # Ignore Missing Anti-clickjacking Header
IGNORE:10021  # Ignore X-Content-Type-Options Header Missing
IGNORE:10027  # Ignore Information Disclosure - Suspicious Comments
IGNORE:10037  # Ignore Server Leaks Information
IGNORE:10038  # Ignore Content Security Policy Header Not Set
IGNORE:10049  # Ignore Storable and Cacheable Content
IGNORE:10055  # Ignore CSP: Wildcard Directive
IGNORE:10063  # Ignore Permissions Policy Header Not Set
IGNORE:10098  # Ignore Cross-Domain Misconfiguration
IGNORE:10109  # Ignore Modern Web Application
IGNORE:90003  # Ignore Sub Resource Integrity Attribute Missing
