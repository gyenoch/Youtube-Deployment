# OWASP ZAP Custom Rules Configuration
# Format: <action> <alert code> <message>

# Example: FAIL on email hyperlink injection (Alert Code: 40024)
FAIL 40024 "Email hyperlink injection detected"

# FAIL on other injection flaws (e.g., SQL Injection, XSS)
FAIL 40018 "SQL Injection detected"
FAIL 40016 "Cross-Site Scripting (XSS) detected"

# Optionally, you can IGNORE rules that are not relevant
IGNORE 10021 "Cookie without HttpOnly flag"

# IGNORE	10020	Missing Anti-clickjacking Header
# IGNORE	10021	X-Content-Type-Options Header Missing
# IGNORE	10027	Information Disclosure - Suspicious Comments
# IGNORE	10037	Server Leaks Information
# IGNORE	10038	Content Security Policy Header Not Set
# IGNORE	10049	Storable and Cacheable Content
# IGNORE	10055	CSP: Wildcard Directive
# IGNORE	10063	Permissions Policy Header Not Set
# IGNORE	10098	Cross-Domain Misconfiguration
# IGNORE	10109	Modern Web Application
