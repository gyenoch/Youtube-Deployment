name: OWASP ZAP Baseline Scan

on:
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  zap-baseline-scan:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Install Dependencies and Fix Vulnerabilities
      - name: Install Dependencies
        run: |
          npm install
          npm audit fix --force # Fix vulnerabilities automatically
          npx update-browserslist-db@latest # Update Browserslist database

      # Step 3: Build the Application (Ignore Warnings in CI)
      - name: Build Application
        run: CI=false npm run build

      # Step 4: Start the Application
      - name: Start the Application
        run: npm start &
        env:
          PORT: 3000 # Ensure the app runs on the expected port

      # Step 5: Run ZAP Baseline Scan
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.5.0
        with:
          target: http://localhost:3000 # URL of your running application
          fail_on_warn: false           # Allow workflow to continue even with warnings
          rules_file_name: ""           # Do not provide a rules file
          format: html                  # Generate a report in HTML format
        env:
          ZAP_API_KEY: ${{ secrets.ZAP_API_KEY }}

      # Step 6: Upload the ZAP report as an artifact
      - name: Upload ZAP Report
        uses: actions/upload-artifact@v3
        with:
          name: zap-report
          path: zap_report.html

