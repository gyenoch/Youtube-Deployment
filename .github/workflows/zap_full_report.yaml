name: OWASP ZAP Baseline Scan

on:
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  zap-baseline-scan:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Log in to Docker Hub (only if necessary)
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v2
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 2: Install Dependencies and Fix Vulnerabilities
      - name: Install Dependencies
        run: |
          npm install
          npm audit fix || echo "Ignoring vulnerabilities for now"
          npx update-browserslist-db@latest # Update Browserslist database

      # Step 3: Build the Application (Ignore Warnings in CI)
      - name: Build Application
        run: CI=false npm run build

      # Step 4: Start the Application
      - name: Start the Application
        run: npm start &
        env:
          PORT: 3000 # Ensure the app runs on the expected port

      - name: Wait for Application to Start
        run: |
          until curl --silent --fail http://localhost:3000; do
            echo "Waiting for app to start..."
            sleep 5
          done
        

      # Step 5: Run ZAP Baseline Scan
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.6.0
        with:
          target: http://localhost:3000 # URL of your running application
          rules_file_name: ""           # Do not provide a rules file
          docker_name: owasp/zap2docker # Correct Docker image name
        env:
          ZAP_API_KEY: ${{ secrets.ZAP_API_KEY }}

      # Step 6: Upload the ZAP report as an artifact
      - name: Upload ZAP Report
        uses: actions/upload-artifact@v3
        with:
          name: zap-report
          path: zap_report.html

