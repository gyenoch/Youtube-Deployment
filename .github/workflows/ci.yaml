  snyk-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Snyk and Snyk-to-HTML
        run: |
            npm install -g snyk snyk-to-html

      - name: Run Snyk scan
        #continue-on-error: true
        env:
            SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
            snyk test --all-projects --severity-threshold=high --json > snyk-report.json
            

      - name: Convert JSON to HTML
        if: always()
        run: |
            if [ -f snyk-report.json ] && [ $(jq -e '.vulnerabilities | length > 0' snyk-report.json) == "true" ]; then
                snyk-to-html -i snyk-report.json -o snyk-report.html
            fi

      - name: Upload Snyk Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
            name: snyk-report
            path: snyk-report.html

      - name: Generate Issue Content
        if: always()
        run: |
            if jq -e '.vulnerabilities | length > 0' snyk-report.json > /dev/null; then
            jq -r '.vulnerabilities[] | "- \(.title): Severity \(.severity) in \(.packageName)"' snyk-report.json > issue-content.txt
            else
            echo "No vulnerabilities found" > issue-content.txt
            fi

      - name: Create GitHub issue if vulnerabilities are found
        if: failure() 
        uses: peter-evans/create-issue-from-file@v5
        with:
            title: "Security issue detected by Snyk"
            content-filepath: issue-content.txt


