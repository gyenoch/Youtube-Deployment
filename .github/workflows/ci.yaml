name: Security Scans

on:
  push:
    branches:
      - main
  pull_request:

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  ZAP_API_KEY: ${{ secrets.ZAP_API_KEY }}
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  APPLICATION_NAME: "youtube-clone-app"

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Run npm audit #npm audit fix
        continue-on-error: true
        run: npm audit --html > npm-audit-report.html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.html

      - name: Create GitHub issue if vulnerabilities are found
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Security issue detected by npm audit"
          content-filepath: npm-audit-report.html

  
  sonarqube-scan:
    runs-on: ubuntu-latest
    #needs: build
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Disable shallow clones for better analysis

      # Step 1: Run SonarQube Scan
      - uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Step 2: Check SonarQube Quality Gate Status
      - uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Step 3: Fetch SonarQube Analysis Report
      - name: Fetch SonarQube Report
        run: |
          PROJECT_KEY=Youtube
          curl -u ${{ secrets.SONAR_TOKEN }}: \
            "${{ secrets.SONAR_HOST_URL }}/api/issues/search?componentKeys=$PROJECT_KEY&ps=500" \
            -o sonarqube-report.json

      # Step 4: Enrich the Report with Rule Details
      - name: Fetch Rule Descriptions
        run: |
          mkdir -p rules
          jq -r '.issues[].rule' sonarqube-report.json | sort | uniq | while read -r rule; do
            curl -u ${{ secrets.SONAR_TOKEN }}: \
              "${{ secrets.SONAR_HOST_URL }}/api/rules/show?key=$rule" \
              -o "rules/$rule.json"
          done

      # Step 5: Convert JSON Report to HTML
      - name: Convert JSON to HTML
        run: |
          echo "<html><head><title>SonarQube Report</title></head><body>" > sonarqube-report.html
          echo "<h1>SonarQube Analysis Report</h1>" >> sonarqube-report.html
          jq -r '.issues[] | "<p><b>Rule:</b> \(.rule) <br/><b>Severity:</b> \(.severity) <br/><b>Message:</b> \(.message) <br/><b>File:</b> \(.component) <br/><b>Line:</b> \(.line) <br/><b>Description:</b> \(.ruleDescription)</p>"' sonarqube-report.json >> sonarqube-report.html
          echo "</body></html>" >> sonarqube-report.html

      # Step 6: Upload SonarQube Report as Artifact
      - name: Upload SonarQube Report
        uses: actions/upload-artifact@v4
        with:
          name: SonarQube-Report
          path: sonarqube-report.html


      - name: Create GitHub issue if vulnerabilities are found
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
            title: "SonarQube Quality Gate Failed"
            content-filepath: sonarqube-report.html

            
  trivy-fs-scan:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Trivy
          uses: aquasecurity/trivy-action@0.28.0
          with:
            scan-type: 'fs'
            scan-ref: '.'

        - name: Scan for vulnerabilities
          #continue-on-error: true
          run: |
            trivy fs \
            --scanners vuln \
            --exit-code 1 \
            --cache-dir /tmp/trivy-cache \
            --format table \
            -o trivy-fs-report.html .
   
        - name: Upload Trivy Report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Trivy-Report
            path: trivy-fs-report.html

        - name: Create GitHub issue if vulnerabilities are found
          if: failure()
          uses: peter-evans/create-issue-from-file@v5
          with:
            title: "Trivy FS Vulnerability Scan Failed"
            content-filepath: trivy-fs-report.html


